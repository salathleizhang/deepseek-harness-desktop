# Build and publish the Electron desktop app installers: a macOS arm64 .dmg and
# a Windows x64 NSIS installer. A manual dispatch builds the installers without
# running the repository's
# other release and CI workflows. Run it from a dsh-v* tag with publish=true to
# create a GitHub Release with the installers.
#
# The macOS job signs with the Developer ID Application identity and notarizes
# via notarytool (credentials come from repository secrets); the Windows job
# stays unsigned until an Authenticode certificate is added. The installers use
# versioned filenames, with the tag and both package manifests carrying the
# same version. electron-builder's `publish` config (with `--publish never`)
# also writes channel update metadata, which the jobs upload alongside the
# installers to serve the in-app electron-updater feed.
name: Release (Desktop)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create a GitHub Release from the built installers. Run this workflow from a dsh-v* tag.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Pack runs per ref so a manual rehearse never displaces a tag push; the
  # release job below is the only step that writes and it targets one tag.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build-macos:
    name: macOS (arm64 dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm run build

      # Import the Developer ID Application .p12 into a scratch keychain and
      # let codesign read the private key without prompting; electron-builder
      # resolves `mac.identity` against this default keychain.
      - name: Import signing certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$MAC_CERT_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MAC_CERT_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MAC_CERT_PASSWORD" build.keychain

      # electron-builder notarizes with notarytool; APPLE_API_KEY must name the
      # App Store Connect API key's .p8 file, so decode the secret to disk and
      # point the env var at it for the packaging steps.
      - name: Prepare notarization credentials
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$APPLE_API_KEY_B64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          else
            echo "Notarization credentials not set; the macOS installer will be signed but not notarized."
          fi

      # The fixed target command stages the self-contained runtime and builds
      # the host-arch (arm64) installers.
      - name: Package macOS
        env:
          DSH_DESKTOP_APP_ID: com.deepseek.dsh-desktop
          DSH_DESKTOP_MACOS_SIGNING_IDENTITY: Junwei Zhang (7HP3X3977Y)
          DSH_DESKTOP_MACOS_TEAM_ID: 7HP3X3977Y
          DSH_DESKTOP_AUTO_UPDATE_ENV: production
        run: pnpm run package:desktop:mac:arm64

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            apps/desktop/.desktop-build/targets/mac-arm64/artifacts/*.dmg
            apps/desktop/.desktop-build/targets/mac-arm64/artifacts/*.zip
            apps/desktop/.desktop-build/targets/mac-arm64/artifacts/*.zip.blockmap
            apps/desktop/.desktop-build/targets/mac-arm64/artifacts/*.yml
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Windows (x64 NSIS)
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm run build

      - name: Package Windows
        env:
          DSH_DESKTOP_APP_ID: com.deepseek.dsh-desktop
        run: pnpm run package:desktop:win:x64:unsigned

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/deepseek-harness-*-win-x64.exe
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/deepseek-harness-*-win-x64.exe.blockmap
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.yml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: Verify release tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/dsh-v*) ;;
            *) echo "::error::release requires a dsh-v* tag, got ${GITHUB_REF}"; exit 1 ;;
          esac

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${GITHUB_REF#refs/tags/dsh-v}"
          channel=latest
          if [[ "$version" == *-* ]]; then
            channel="${version#*-}"
            channel="${channel%%.*}"
          fi
          assets=(
            "dist/deepseek-harness-${version}-mac-arm64.dmg"
            "dist/deepseek-harness-${version}-mac-arm64.zip"
            "dist/deepseek-harness-${version}-mac-arm64.zip.blockmap"
            "dist/deepseek-harness-${version}-win-x64.exe"
            "dist/deepseek-harness-${version}-win-x64.exe.blockmap"
            "dist/${channel}-mac.yml"
          )
          if [ -f "dist/${channel}.yml" ]; then
            assets+=("dist/${channel}.yml")
          fi
          for asset in "${assets[@]}"; do
            if [ ! -s "$asset" ]; then
              echo "::error::missing or empty release asset: ${asset}"
              exit 1
            fi
          done
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" \
              --title "DeepSeek Harness Desktop ${version}" \
              --generate-notes \
              "${assets[@]}"
          fi
